services:
  wudlands:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"  # Next.js frontend
      - "8000:8000"  # FastAPI backend
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - wudlands-network

networks:
  wudlands-network:
    driver: bridge
